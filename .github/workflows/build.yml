name: build

on: [push, pull_request]

permissions:
  contents: read

jobs:
  build_matrix:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Every supported Ruby against the newest Puma.
          - { ruby: "3.0", puma: "~> 8.0" }
          - { ruby: "3.1", puma: "~> 8.0" }
          - { ruby: "3.2", puma: "~> 8.0" }
          - { ruby: "3.3", puma: "~> 8.0" }
          - { ruby: "3.4", puma: "~> 8.0" }
          # Older Puma majors against the oldest and newest supported Ruby.
          - { ruby: "3.0", puma: "~> 7.0" }
          - { ruby: "3.4", puma: "~> 7.0" }
          - { ruby: "3.0", puma: "~> 6.6" }
          - { ruby: "3.4", puma: "~> 6.6" }

    runs-on: ubuntu-latest

    env:
      PUMA_VERSION: ${{ matrix.puma }}
      # The committed Gemfile.lock pins the default Puma; pinning another
      # version via PUMA_VERSION requires resolving a fresh lockfile.
      BUNDLE_FROZEN: "false"

    steps:
      # Environment setup
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Run rubocop
        run: |
          bundle exec rubocop --display-cop-names

      - name: Run tests
        run: |
          bundle exec rspec

  build:
    needs: [build_matrix]
    runs-on: ubuntu-24.04
    steps:
      - name: Dummy for branch status checks
        run: |
          echo "build complete"
