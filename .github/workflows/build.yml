name: build

on: [push, pull_request]

permissions:
  contents: read

jobs:
  build_matrix:
    strategy:
      matrix:
        os:
          - "ubuntu-22.04"
          - "ubuntu-24.04"
          - "ubuntu-latest"
        ruby:
          - "3.0"
          - "3.1"
          - "3.2"
          - "3.3"
          - "3.4"
        puma:
          - "~> 6.6"
          - "~> 7.0"
          - "~> 8.0"

    runs-on: ${{ matrix.os }}

    env:
      PUMA_VERSION: ${{ matrix.puma }}
      # The committed Gemfile.lock pins the default Puma; pinning another
      # version via PUMA_VERSION requires resolving a fresh lockfile.
      BUNDLE_FROZEN: "false"

    steps:
      # Environment setup
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Run rubocop
        run: |
          bundle exec rubocop --display-cop-names

      - name: Run tests
        run: |
          bundle exec rspec

  build:
    needs: [build_matrix]
    runs-on: ubuntu-24.04
    steps:
      - name: Dummy for branch status checks
        run: |
          echo "build complete"
